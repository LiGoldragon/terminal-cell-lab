[package]
name         = "terminal-cell"
version      = "1.0.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/terminal-cell"
description  = "Low-level durable terminal cell with transcript replay."
publish      = false

[lib]
name = "terminal_cell"
path = "src/lib.rs"

[dependencies]
crossterm    = "0.28"
kameo        = { git = "https://github.com/LiGoldragon/kameo.git", branch = "main", features = ["macros"] }
dotos      = { git = "https://github.com/LiGoldragon/dotos.git", rev = "80c7b17f7ad3cf547d2624c6a243e5de5f85c9f3" }
portable-pty = "0.8"
regex        = "1"
rkyv         = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "ca72b2d1151f5b3df536295b2ba68f039536ec19" }
signal-terminal = { git = "https://github.com/LiGoldragon/signal-terminal.git", rev = "ddbd3237a57e3ca19b5f6208a93770c5eee73aa3" }
signal-hook  = "0.3"
thiserror    = "2"
tokio        = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
triad-runtime = { git = "https://github.com/LiGoldragon/triad-runtime.git", rev = "e44c07dbf31497af95eb461826bb9502115fbcfe" }
vt100        = "0.16"

[features]
default = []
dotos-text = []

[build-dependencies]
schema-rust = { package = "schema-rust", git = "https://github.com/LiGoldragon/schema-rust.git", rev = "6179a7cf1394083244dd3f3e1d2709f9ec08f7db" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"

[patch.crates-io]
kameo = { git = "https://github.com/LiGoldragon/kameo.git", branch = "main" }
